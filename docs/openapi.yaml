openapi: 3.0.3
info:
  title: ProcureAI API
  version: 1.0.0
  description: |
    Agentic procurement API (marketplace + payables). Sandbox PayPal only.
    Designed for APIMatic DX (SDKs, docs portal, MCP) from this OpenAPI source.
  contact:
    name: ProcureAI hackathon
servers:
  - url: https://agentic-procurement-api.onrender.com
    description: Render production
  - url: http://localhost:4000
    description: Local
security:
  - OwnerKey: []
paths:
  /health:
    get:
      security: []
      summary: Health check
      responses:
        "200":
          description: OK
  /api/negotiations:
    get:
      summary: List negotiations
      responses:
        "200":
          description: Negotiation list
    post:
      summary: Create and queue negotiation (DEMO_MAX_USD enforced)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [brief, priority, quantity, maxUnitPrice, currency, neededByDays, idempotencyKey]
              properties:
                brief: { type: string }
                priority: { type: string, enum: [price, speed, balanced] }
                quantity: { type: integer }
                maxUnitPrice: { type: string }
                currency: { type: string, enum: [USD, SGD, INR] }
                neededByDays: { type: integer }
                idempotencyKey: { type: string }
      responses:
        "201":
          description: Queued
  /api/invoices/extract:
    post:
      summary: Extract supplier invoice from pasted text
      responses:
        "201":
          description: Extracted
  /api/invoices/{id}/match:
    post:
      summary: Three-way match PO vs receipt vs invoice
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Match result
  /api/invoices/{id}/payout:
    post:
      summary: PayPal Payouts for MATCHED invoice (≤ DEMO_MAX_USD)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "201":
          description: Payout batch submitted
  /api/stretch/fx/normalize:
    post:
      summary: Compare USD/SGD/INR quotes in a base currency
      responses:
        "200":
          description: Ranked quotes
  /api/stretch/replenishment/evaluate:
    post:
      summary: Evaluate low-stock rules and queue negotiations
      responses:
        "200":
          description: Triggered rules
  /api/sponsors/channel3/search:
    post:
      summary: Channel3 catalog enrich (env-gated)
      responses:
        "200":
          description: Products + RFQ suggestion
  /api/sponsors/kernel/fetch-invoice:
    post:
      summary: KERNEL/direct fetch of public invoice page text
      responses:
        "200":
          description: Page text
  /api/sponsors/agents:
    get:
      summary: Astropods-style agent registry
      responses:
        "200":
          description: Agent inventory
  /api/sponsors/timeline:
    get:
      summary: Bryntum-style delivery/payout timeline
      responses:
        "200":
          description: Schedule events
components:
  securitySchemes:
    OwnerKey:
      type: apiKey
      in: header
      name: x-owner-key
