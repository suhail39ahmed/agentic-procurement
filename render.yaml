# Render Blueprint — agentic procurement (web + api)
# Uses existing Singapore Postgres (set DATABASE_URL in Dashboard; do not recreate DB here).
# After first API deploy, set web API_BASE_URL to the API public URL, e.g.
# https://agentic-procurement-api.onrender.com

services:
  - type: web
    name: agentic-procurement-api
    runtime: node
    region: singapore
    plan: free
    rootDir: .
    buildCommand: npx --yes pnpm@9.15.9 install --frozen-lockfile
    startCommand: npx --yes pnpm@9.15.9 --filter api start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24.22.2"
      - key: DATABASE_URL
        sync: false
      - key: OWNER_ID
        sync: false
      - key: OWNER_API_KEY
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: SLACK_CHANNEL
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: MANDATE_SECRET
        sync: false
      - key: DEMO_MAX_USD
        value: "2"
      - key: CHANNEL3_API_KEY
        sync: false
      - key: KERNEL_API_KEY
        sync: false
      - key: ASTROPODS_WORKSPACE
        sync: false

  - type: web
    name: agentic-procurement-web
    runtime: node
    region: singapore
    plan: free
    rootDir: .
    buildCommand: npx --yes pnpm@9.15.9 install --frozen-lockfile && npx --yes pnpm@9.15.9 --filter web build
    startCommand: npx --yes pnpm@9.15.9 --filter web start
    envVars:
      - key: NODE_VERSION
        value: "24.22.2"
      - key: API_BASE_URL
        sync: false
      - key: OWNER_API_KEY
        sync: false
      - key: ADMIN_API_KEY
        sync: false

  # Render Workflows — long-running agent tasks (negotiate, replenish, FX, forecast)
  - type: workflow
    name: agentic-procurement-workflows
    runtime: node
    region: singapore
    repo: https://github.com/suhail39ahmed/agentic-procurement
    rootDir: .
    buildCommand: npx --yes pnpm@9.15.9 install --frozen-lockfile
    startCommand: npx --yes pnpm@9.15.9 --filter workflows start
    envVars:
      - key: NODE_VERSION
        value: "24.22.2"
